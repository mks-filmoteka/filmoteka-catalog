spring:
  kafka:
    admin:
      auto-create: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/filmoteka
          jwk-set-uri: http://localhost:8180/realms/filmoteka/protocol/openid-connect/certs
          audiences:
            - filmoteka-api

logging:
  level:
    root: WARN

app:
  outbox:
    publisher:
      enabled: false
    cleanup:
      enabled: false
      retention-days: 3
  cors:
    allowed-origins: http://localhost:5173
  kafka:
    topics:
      film-deleted:
        name: film-deleted-test
      film-poster-changed:
        name: film-poster-changed-test
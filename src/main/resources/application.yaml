server:
  port: 8080

spring:
  application:
    name: filmoteka-catalog

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: filmoteka
    baseline-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: filmoteka
        format_sql: true
        default_batch_fetch_size: 50

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI}
          jwk-set-uri: ${AUTH_JWK_SET_URI}
          audiences:
            - ${AUTH_AUDIENCE}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  kafka:
    topics:
      film-deleted:
        name: ${KAFKA_FILM_DELETED_TOPIC}
      film-poster-changed:
        name: ${KAFKA_FILM_POSTER_CHANGED_TOPIC}

  outbox:
    cleanup:
      enabled: true
      retention-days: 7

logging:
  level:
    root: INFO
    io.github.mksfilmoteka.catalog: DEBUG
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
